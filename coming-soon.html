<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ===== SEO TITLE & META ===== -->
    <title>Coming Soon | Inkwell Impressions - Premium B2B Printing Solutions</title>
    <meta name="description" content="Something exciting is coming soon from Inkwell Impressions. Stay tuned for premium B2B printing, custom packaging, and promotional products." />
    <link rel="canonical" href="https://www.inkwell-impressions.com/coming-soon.html" />

    <!-- ===== PRELOAD FONTS ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">

    <!-- ===== TAILWIND CSS ===== -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-blue': '#0B132B',
                        'brand-red': '#D62828',
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        serif: ['Libre Baskerville', 'serif'],
                    }
                }
            }
        }
    </script>

    <!-- ===== FONT AWESOME ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- ===== EXTERNAL CSS (Unchanged - Waisay hi) ===== -->
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/coming-soon.css">

    <!-- ===== SCHEMA MARKUP (JSON-LD) - SEO BOOST ===== -->
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebPage",
            "name": "Coming Soon | Inkwell Impressions",
            "description": "Something exciting is coming soon from Inkwell Impressions. Stay tuned for premium B2B printing, custom packaging, and promotional products.",
            "url": "https://www.inkwell-impressions.com/coming-soon.html",
            "publisher": {
                "@type": "Organization",
                "name": "Inkwell Impressions Solutions",
                "logo": "https://www.inkwell-impressions.com/bold.webp"
            }
        }
    </script>

    <style>
        /* ===== Coming Soon Page Styles (Critical CSS Inline) ===== */
        .coming-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0B132B;
            z-index: -2;
        }

        .glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
            pointer-events: none;
            z-index: -1;
        }

        .glow-1 {
            width: 600px;
            height: 600px;
            background: #D62828;
            top: -200px;
            right: -200px;
        }

        .glow-2 {
            width: 500px;
            height: 500px;
            background: #0B132B;
            bottom: -200px;
            left: -200px;
            opacity: 0.2;
        }

        .content {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem 1.5rem;
            gap: 0.5rem;
        }

        .logo {
            margin-bottom: 0.5rem;
        }

        .title {
            font-family: 'Libre Baskerville', serif;
            font-size: clamp(3rem, 10vw, 6rem);
            font-weight: 700;
            color: white;
            letter-spacing: -0.02em;
            margin-bottom: 0.25rem;
        }

        .title span {
            color: #D62828;
        }

        .subtitle {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(1rem, 2vw, 1.4rem);
            font-weight: 300;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: #D62828;
            font-size: 0.5rem;
            margin: 0.5rem 0;
        }

        .divider i {
            opacity: 0.6;
        }

        .divider i.fa-circle {
            font-size: 0.35rem;
            opacity: 0.8;
        }

        .description {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(0.9rem, 1.2vw, 1.1rem);
            font-weight: 300;
            color: rgba(255, 255, 255, 0.6);
            max-width: 480px;
            line-height: 1.7;
            margin: 0.5rem auto 1rem;
        }

        .social {
            display: flex;
            gap: 1rem;
            margin: 1rem 0;
        }

        .social a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
            text-decoration: none;
            font-size: 1rem;
        }

        .social a:hover {
            background: #D62828;
            border-color: #D62828;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(214, 40, 40, 0.25);
        }

        .back-home {
            font-family: 'Outfit', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            transition: color 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .back-home:hover {
            color: white;
        }

        .back-home i {
            font-size: 0.7rem;
        }

        /* ===== RESPONSIVE TWEAKS ===== */
        @media (max-width: 640px) {
            .content {
                padding: 1.5rem 1rem;
                gap: 0.25rem;
            }
            .social a {
                width: 38px;
                height: 38px;
                font-size: 0.85rem;
            }
        }
    </style>

</head>

<body>

    <!-- ===== BACKGROUND ===== -->
    <div class="coming-bg"></div>

    <!-- ===== GLOW EFFECTS ===== -->
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="content">

        <!-- Logo (Optimized - bold.webp) -->
        <img class="logo h-20 sm:h-28 lg:h-32 xl:h-40 w-auto object-contain" 
             src="./bold.webp" 
             alt="Inkwell Impressions Logo - Premium B2B Printing Solutions"
             width="160" height="80"
             loading="eager" />

        <!-- Title -->
        <h1 class="title">
            Coming <span>Soon</span>
        </h1>

        <!-- Subtitle -->
        <p class="subtitle">Something Exciting Is On The Way</p>

        <!-- Divider -->
        <div class="divider" aria-hidden="true">
            <i class="fa-solid fa-asterisk"></i>
            <i class="fa-solid fa-circle"></i>
            <i class="fa-solid fa-asterisk"></i>
        </div>

        <!-- Description -->
        <p class="description">
            We're crafting something amazing to help you build brands that leave lasting impressions.
        </p>

        <!-- Social Links -->
        <div class="social">
            <a href="https://www.linkedin.com/in/inkwell-impressions-2007883b4" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
                <i class="fa-brands fa-linkedin-in"></i>
            </a>
            <a href="https://www.instagram.com/inkwellimpressionspromo/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                <i class="fa-brands fa-instagram"></i>
            </a>
            <a href="https://www.facebook.com/profile.php?id=61552261877738" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
                <i class="fa-brands fa-facebook-f"></i>
            </a>
            <a href="https://x.com/Inkwell_Imp" target="_blank" rel="noopener noreferrer" aria-label="Twitter">
                <i class="fa-brands fa-twitter"></i>
            </a>
        </div>

        <!-- Back to Home -->
        <a href="index.html" class="back-home">
            <i class="fa-solid fa-arrow-left"></i> Back to Home
        </a>

    </div>

    <!-- ============================================================ -->
    <!-- GSAP Animation (Defer - Non-blocking) -->
    <!-- ============================================================ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            gsap.from('.content', {
                opacity: 0,
                y: 50,
                duration: 1.2,
                ease: 'power2.out'
            });

            gsap.from('.logo', {
                opacity: 0,
                scale: 0.8,
                duration: 1,
                delay: 0.3,
                ease: 'back.out(1.7)'
            });

            gsap.from('.title, .subtitle, .divider, .description, .social, .back-home', {
                opacity: 0,
                y: 20,
                duration: 0.6,
                stagger: 0.12,
                delay: 0.6,
                ease: 'power2.out'
            });
        });
    </script>

</body>

</html>
