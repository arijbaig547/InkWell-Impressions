<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coming Soon · Inkwell Impressions</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Libre+Baskerville:wght@400;700&display=swap"
        rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-blue': '#0B132B',
                        'brand-red': '#D62828',
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        serif: ['Libre Baskerville', 'serif'],
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/coming-soon.css">
</head>

<body>

    <!-- Background -->
    <div class="coming-bg"></div>

    <!-- Glow Effects -->
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <!-- Content -->
    <div class="content">

        <!-- Logo -->
        <img class="h-20 sm:h-28 lg:h-32 xl:h-40 w-auto object-contain" src="./logo bold.png" alt="Inkwell Impressions" class="logo">

        <!-- Title -->
        <h1 class="title">Coming Soon</h1>

        <!-- Subtitle -->
        <p class="subtitle">Something Exciting Is On The Way</p>

        <!-- Divider -->
        <div class="divider">
            <i class="fa-solid fa-asterisk"></i>
            <i class="fa-solid fa-circle"></i>
            <i class="fa-solid fa-asterisk"></i>
        </div>

        <!-- Description -->
        <p class="description">
            We're crafting something amazing to help you build brands that leave lasting impressions.
        </p>

        <!-- Social Links -->
        <div class="social">
            <a href="https://www.linkedin.com/in/inkwell-impressions-2007883b4" target="_blank">
                <i class="fa-brands fa-linkedin-in"></i>
            </a>
            <a href="https://www.instagram.com/inkwellimpressionspromo/" target="_blank">
                <i class="fa-brands fa-instagram"></i>
            </a>
            <a href="https://www.facebook.com/profile.php?id=61552261877738" target="_blank">
                <i class="fa-brands fa-facebook-f"></i>
            </a>
            <a href="https://x.com/Inkwell_Imp" target="_blank">
                <i class="fa-brands fa-twitter"></i>
            </a>
        </div>

        <!-- Back to Home -->
        <a href="index.html" class="back-home">
            <i class="fa-solid fa-arrow-left"></i> Back to Home
        </a>

    </div>

    <!-- GSAP Animation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            gsap.from('.content', {
                opacity: 0,
                y: 50,
                duration: 1.2,
                ease: 'power2.out'
            });

            gsap.from('.logo', {
                opacity: 0,
                scale: 0.8,
                duration: 1,
                delay: 0.3,
                ease: 'back.out(1.7)'
            });

            gsap.from('.title, .subtitle, .divider, .description, .social, .back-home', {
                opacity: 0,
                y: 20,
                duration: 0.6,
                stagger: 0.12,
                delay: 0.6,
                ease: 'power2.out'
            });
        });
    </script>

</body>

</html>
